[project]
name = "fathom"
version = "0.1.0"
description = "Deterministic ScubaGear-to-OSCAL compiler with a verified AI analyst"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jsonschema>=4.23",
    "networkx>=3.4",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    # Loads .env in config.py. Declared explicitly: it arrives transitively via
    # uvicorn[standard] today, and depending on that is how configuration breaks
    # the day someone installs without the [standard] extra.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
llm = ["openai>=1.54"]

[project.scripts]
fathom = "fathom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fathom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
